<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">
<div layout:fragment="content">
    <div class="row mt-3">
        <div class="col">

            <div class="card">
                <div class="card-header">
                  Board Register
                </div>
                <div class="card-body">
                    <form action="/board/register" method="post">
                        <div class="form-group mb-3">
                            <span class="input-group-text">Title</span>
                            <input type="text" class="form-control" name="title" placeholder="Title">
                        </div>
                        <div class="form-group mb-3">
                            <span class="input-group-text">Content</span>
                            <textarea class="form-control col-sm-5" name="content" rows="5" placeholder="Content"></textarea>
                        </div>
                        <div class="form-group mb-3">
                            <span class="input-group-text">Writer</span>
                            <input type="text" class="form-control" name="writer" placeholder="Writer">
                        </div>

                        <div class="form-group mb-3">
                            <span class="input-group-text">Images</span>
                            <span class="custom-file-upload uploadHidden">
                                <button type="button" class="btn btn-primary uploadFileBtn">Add Files</button>
                            </span>

                        </div>

                        <div class="float-end">
                            <button type="submit" class="btn btn-primary submitBtn">Submit</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!--첨부파일 섬네일 보여줄 부분-->
    <div class="row mt-3">
        <div class="col">
            <div class="container-fluid d-flex uploadResult" style="flex-wrap: wrap;"></div>
        </div>
    </div>

    <!--첨부추가를 위한 모달창 -->
    <div class="modal uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="file" class="form-control" name="files" multiple>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary uploadBtn">Upload</button>
                    <button type="button" class="btn btn-outline-dark closeUploadBtn">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/upload.js"></script>
</div>
<script layout:fragment="script" th:inline="javascript">
    const errors = [[${errors}]];
    console.log(errors);

    let errorMsg = '';
    if(errors){
        for(let i in errors){
            errorMsg += `${errors[i].field}은(는) ${errors[i].code }\n`
        }
        alert(errorMsg);
    }



    // 업로드 모달창 보임
    const uploadModal = new bootstrap.Modal(document.querySelector('.uploadModal'), {});
    document.querySelector(".uploadFileBtn").addEventListener("click", function(e){
        e.stopPropagation();
        e.preventDefault();
        uploadModal.show();
    }, false);

    document.querySelector(".uploadBtn").addEventListener("click", function(e){
        const formObj = new FormData();
        const fileInput = document.querySelector("input[name=files]");
        const files = fileInput.files;
        for(let i = 0; i < files.length; i++)
        {
            formObj.append("files", files[i]);
        }

        uploadToServer(formObj).then(result=>{

            for(const uploadResult of result){
                showUploadFile(uploadResult);
            }
            uploadModal.hide();
        }).catch(err=>{
            uploadModal.hide();
        });
    })

    // 경로 저장 후 등록
    document.querySelector(".submitBtn").addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        const target = document.querySelector(".uploadHidden");
        const uploadFiles = document.querySelector(".uploadResult").querySelectorAll("img");

        let str = ''
        for(let i = 0; i < uploadFiles.length; i++){
            const uploadFile = uploadFiles[i];
            const imgLink = uploadFile.getAttribute("data-src");
            console.log(imgLink);
            str += `<input type='hidden' name='fileNames' value="${imgLink}">`;
        }

        target.innerHTML = str;
        console.log("submit 직전 img 개수:", document.querySelector(".uploadResult").querySelectorAll("img").length);
        document.querySelector("form").submit();
    },false)

    function showUploadFile({uuid, fileName, link})
    {
        const str = `<div class="card col-4">
                            <div class="card-header d-flex justify-content-center">
                                ${fileName}
                                <button class="btn-sm btn-danger" onclick="javascript:removeFile('${uuid}', '${fileName}', this)">X</button>
                            </div>
                            <div class="card-body">
                                <img src="/view/${link}" data-src="${uuid+"_"+fileName}"></img>
                            </div>
                       </div><!-- card -->`;

        document.querySelector(".uploadResult").innerHTML += str;
    }

    function removeFile(uuid, fileName, obj)
    {
        console.log(uuid);
        console.log(fileName);
        console.log(obj);

        const targetDiv = obj.closest(".card");
        removeFileToServer(uuid, fileName).then(result=>{
            targetDiv.remove();
        });
    }
</script>
